<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivo audiovisual · Buscador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#16232E; --papel:#F1F2EE; --panel:#FFFFFF;
  --linea:#CBCEC6; --senal:#D99B12; --agua:#2E6E73; --gris:#6B7169;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);
  font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header.top{padding:34px 0 22px;border-bottom:2px solid var(--tinta)}
h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.015em}
.sub{margin:5px 0 0;color:var(--gris);font-size:14px}

.buscador{margin:22px 0 0;display:flex;gap:10px;flex-wrap:wrap}
#q{flex:1 1 320px;min-width:0;font-family:inherit;font-size:20px;font-weight:500;
  padding:15px 17px;border:2px solid var(--tinta);background:var(--panel);
  color:var(--tinta);border-radius:2px}
#q:focus{outline:3px solid var(--senal);outline-offset:1px}
#q::placeholder{color:#9AA096;font-weight:400}

.filtros{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 0;align-items:center}
select,input[type=date]{font-family:inherit;font-size:13px;padding:8px 10px;
  border:1px solid var(--linea);background:var(--panel);color:var(--tinta);border-radius:2px}
select:focus,input:focus{outline:2px solid var(--senal);outline-offset:1px}
.limpiar{font-family:inherit;font-size:13px;padding:8px 12px;cursor:pointer;
  background:none;border:1px solid var(--linea);color:var(--gris);border-radius:2px}
.limpiar:hover{border-color:var(--tinta);color:var(--tinta)}

.barra{display:flex;justify-content:space-between;align-items:baseline;
  gap:14px;padding:16px 0 9px;flex-wrap:wrap}
.cuenta{font-size:14px;font-weight:600}
.cuenta em{font-style:normal;color:var(--gris);font-weight:400}
.acciones{display:flex;gap:8px}
.acciones button{font-family:inherit;font-size:13px;padding:7px 12px;cursor:pointer;
  background:var(--tinta);color:var(--papel);border:none;border-radius:2px}
.acciones button:hover{background:#2A3D4C}

ul.res{list-style:none;margin:0;padding:0 0 60px}
li.op{display:grid;grid-template-columns:104px 1fr;gap:18px;
  padding:16px 0;border-bottom:1px solid var(--linea)}
.fecha{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;
  padding-left:11px;border-left:3px solid var(--senal);line-height:1.35}
.fecha .anio{display:block;color:var(--gris);font-weight:400}
.fecha.sinf{border-left-color:var(--linea);color:var(--gris)}
.desc{margin:0 0 5px;font-size:16px;font-weight:600;line-height:1.32}
.meta{font-size:13px;color:var(--gris);margin:0 0 6px}
.meta b{font-weight:500;color:var(--tinta)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 0}
.tag{font-size:12px;padding:2px 8px;border:1px solid var(--linea);border-radius:2px;background:var(--panel)}
.tag.dep{border-color:var(--agua);color:var(--agua)}
.tag.mat{color:var(--gris)}
.ruta{margin:9px 0 0;font-size:12px;color:var(--gris);word-break:break-word;
  display:flex;gap:9px;align-items:flex-start}
.ruta code{font-family:'Archivo',sans-serif;background:#E6E8E2;padding:2px 6px;border-radius:2px;flex:1}
.abrir{flex:none;font-size:12px;font-weight:600;padding:3px 10px;text-decoration:none;
  background:var(--tinta);color:var(--papel);border-radius:2px}
.abrir:hover{background:var(--agua)}
.abrir:focus-visible{outline:3px solid var(--senal);outline-offset:2px}
.nolink{flex:none;font-size:12px;padding:3px 9px;color:#A8ACA3;border:1px dashed var(--linea);border-radius:2px}
.copiar{flex:none;font-family:inherit;font-size:12px;padding:3px 9px;cursor:pointer;
  border:1px solid var(--linea);background:var(--panel);color:var(--gris);border-radius:2px}
.copiar:hover{border-color:var(--tinta);color:var(--tinta)}
mark{background:var(--senal);color:var(--tinta);padding:0 1px}
.vacio{padding:52px 0;text-align:center;color:var(--gris)}
.vacio p{margin:0 0 6px}
.mas{display:block;width:100%;margin:22px 0;padding:13px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:600;background:var(--panel);
  border:1px solid var(--linea);color:var(--tinta);border-radius:2px}
.mas:hover{border-color:var(--tinta)}
footer{border-top:1px solid var(--linea);padding:16px 0 40px;font-size:12px;color:var(--gris)}
@media(max-width:640px){
  li.op{grid-template-columns:1fr;gap:7px}
  .fecha{border-left:none;border-top:3px solid var(--senal);padding:7px 0 0}
  .fecha .anio{display:inline;margin-left:6px}
  #q{font-size:17px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">

    <button class="limpiar" id="reset">Quitar filtros</button>
  </div>
</header>
<div class="barra">
  <span class="cuenta" id="cuenta"></span>

</div>
<ul class="res" id="res"></ul>
<footer id="pie"></footer>
</div>

<script>
const DATOS = JSON.parse(document.getElementById('datos').textContent);
const N = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
DATOS.forEach(r => { r._b = N([r.d,r.a,r.j,r.l,r.p,r.s,r.m,r.r].join(' ')); });

const $ = id => document.getElementById(id);
const PASO = 60; let visibles = PASO;

function opciones(sel, vals, etiqueta){
  sel.innerHTML = '<option value="">'+etiqueta+'</option>' +
    vals.map(v=>'<option>'+v.replace(/</g,'&lt;')+'</option>').join('');
}
opciones($('fDep'), [...new Set(DATOS.flatMap(r=>r.p.split('; ')).filter(Boolean))].sort(), 'Todos los departamentos');
opciones($('fArea'), [...new Set(DATOS.map(r=>r.a).filter(Boolean))].sort(), 'Todas las áreas');
opciones($('fAnio'), [...new Set(DATOS.map(r=>r.f.slice(0,4)).filter(Boolean))].sort().reverse(), 'Todos los años');

function filtrar(){
  const terminos = N($('q').value).split(/\s+/).filter(Boolean);
  const dep=$('fDep').value, area=$('fArea').value, anio=$('fAnio').value;
  const d1=$('fD1').value, d2=$('fD2').value;
  return DATOS.filter(r=>{
    if(terminos.length && !terminos.every(t=>r._b.includes(t))) return false;
    if(dep && !r.p.split('; ').includes(dep)) return false;
    if(area && r.a!==area) return false;
    if(anio && r.f.slice(0,4)!==anio) return false;
    if(d1 && (!r.f || r.f<d1)) return false;
    if(d2 && (!r.f || r.f>d2)) return false;
    return true;
  });
}

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function resaltar(txt){
  const terminos = $('q').value.trim().split(/\s+/).filter(Boolean);
  let h = esc(txt);
  terminos.forEach(t=>{
    const re = new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    h = h.replace(re,'<mark>$1</mark>');
  });
  return h;
}

function fechaLarga(f){
  if(!f) return '<span class="anio">sin fecha</span>';
  const M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const [y,m,d]=f.split('-');
  return d+' '+M[+m-1]+'<span class="anio">'+y+'</span>';
}

let ultimos = [];
function pintar(){
  const r = filtrar(); ultimos = r;
  $('cuenta').innerHTML = r.length===0 ? 'Sin resultados'
    : '<b>'+r.length.toLocaleString('es-AR')+'</b> '+(r.length===1?'carpeta':'carpetas')+
      ' <em>de '+DATOS.length.toLocaleString('es-AR')+'</em>';
  if(r.length===0){
    $('res').innerHTML='<li class="vacio"><p>Ningún operativo coincide con esa búsqueda.</p>'+
      '<p>Probá con menos palabras, o quitá los filtros de fecha.</p></li>';
    return;
  }
  const trozo = r.slice(0, visibles);
  $('res').innerHTML = trozo.map((x,i)=>{
    const loc = x.l ? x.l.split('; ').map(v=>'<span class="tag">'+esc(v)+'</span>').join('') : '';
    const dep = x.p ? x.p.split('; ').map(v=>'<span class="tag dep">'+esc(v)+'</span>').join('') : '';
    const mat = x.m ? x.m.split('; ').slice(0,7).map(v=>'<span class="tag mat">'+esc(v)+'</span>').join('') : '';
    return '<li class="op">'+
      '<div class="fecha'+(x.f?'':' sinf')+'">'+fechaLarga(x.f)+'</div>'+
      '<div><p class="desc">'+resaltar(x.d)+'</p>'+
      (x.a?'<p class="meta"><b>'+esc(x.a)+'</b>'+(x.j?' · '+esc(x.j):'')+'</p>':'')+
      (x.s?'<p class="meta">Incluye: '+resaltar(x.s)+'</p>':'')+
      ((loc||dep||mat)?'<div class="tags">'+dep+loc+mat+'</div>':'')+
      '<div class="ruta">'+(x.k?'<a class="abrir" href="'+esc(x.k)+'" target="_blank" rel="noopener">Abrir en MEGA</a>':'<span class="nolink">sin link</span>')+
      '<code>'+esc(x.r)+'</code>'+
      '<button class="copiar" data-i="'+i+'">'+(x.k?'Copiar link':'Copiar ruta')+'</button></div>'+
      '</div></li>';
  }).join('');
  if(r.length>visibles){
    $('res').insertAdjacentHTML('beforeend',
      '<li><button class="mas" id="mas">Ver '+Math.min(PASO,r.length-visibles)+' más</button></li>');
    $('mas').onclick=()=>{visibles+=PASO;pintar();};
  }
  document.querySelectorAll('.copiar').forEach(b=>{
    b.onclick=()=>{navigator.clipboard.writeText(trozo[+b.dataset.i].k||trozo[+b.dataset.i].r)
      .then(()=>{b.textContent='Copiada';setTimeout(()=>b.textContent='Copiar ruta',1400);});};
  });
}

['q','fDep','fArea','fAnio','fD1','fD2'].forEach(id=>{
  $(id).addEventListener('input',()=>{visibles=PASO;pintar();});
});
$('reset').onclick=()=>{['q','fDep','fArea','fAnio','fD1','fD2'].forEach(i=>$(i).value='');visibles=PASO;pintar();};
$('csv').onclick=()=>{
  const cab=['fecha','descripcion','area','jerarquia','localidades','departamentos','subobras','materiales','ruta','link'];
  const esc2=v=>'"'+String(v||'').replace(/"/g,'""')+'"';
  const txt='\uFEFF'+cab.join(',')+'\n'+ultimos.map(r=>
    [r.f,r.d,r.a,r.j,r.l,r.p,r.s,r.m,r.r,r.k].map(esc2).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download='busqueda-archivo.csv';a.click();
};
const conF = DATOS.filter(r=>r.f).length, conL = DATOS.filter(r=>r.k).length;
$('pie').textContent = DATOS.length.toLocaleString('es-AR')+' carpetas de operativo · '+
  conF.toLocaleString('es-AR')+' con fecha · '+conL.toLocaleString('es-AR')+' con link a MEGA';
pintar();
</script>
</body>
</html>
